[project]
name = "llmtuner"
version = "0.1.0"
description = "A small eval harness that any project or agent can report to"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
llmtuner = "llmtuner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".env", ".env.*", "__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/llmtuner"]
